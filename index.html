<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VentraSA</title>
<meta name="description" content="Venture forward.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VentraSA">
<style>


:root{--bg:#FFFFFF;--badge:#0B1F3A;--v:#FFFFFF;--w1:#0B1F3A;--w2:#007A4D;--sl:#007A4D;--gold:#FFB612}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1F3A;--badge:#FFFFFF;--v:#0B1F3A;--w1:#FFFFFF;--w2:#22C27C;--sl:#22C27C}}
:root[data-theme="dark"]{--bg:#0B1F3A;--badge:#FFFFFF;--v:#0B1F3A;--w1:#FFFFFF;--w2:#22C27C;--sl:#22C27C}
.bg{fill:var(--bg)}.badge{fill:var(--badge)}.vmark{fill:var(--v)}.sun{fill:var(--gold)}
.halo{fill:none;stroke:var(--gold);stroke-width:4}.rule{fill:var(--gold)}
.w1{fill:var(--w1)}.w2{fill:var(--w2)}.sl{fill:var(--sl)}
.ray{stroke:var(--gold);stroke-width:6;stroke-linecap:round;opacity:.9}
.badge,.halo,.rule{transform-box:fill-box;transform-origin:center}
.rule{transform-origin:0 50%}
.play .dawn{animation:dawn 1.6s ease-out 1s both}
.play .badge{animation:pop .7s cubic-bezier(.2,.9,.25,1.15) both}
.play .vmark{animation:rise .6s cubic-bezier(.2,.8,.2,1) .55s both}
.play .sun{animation:sunrise 1.35s cubic-bezier(.16,.84,.24,1) 1s both}
.play .halo{animation:halo 1.1s ease-out 2.1s both}
.play .glyph{animation:rise .55s cubic-bezier(.2,.8,.2,1) calc(1.7s + var(--g)*.055s) both}
.play .rule{animation:rule .6s cubic-bezier(.6,0,.2,1) 2.25s both}
.play .sglyph{animation:rise .4s ease-out calc(2.4s + var(--g)*.03s) both}
.play .ray{animation:rayin .5s ease-out calc(2s + var(--i)*.05s) both,chase 1.8s ease-in-out calc(3s + var(--i)*.14s) infinite}
.exit{animation:exit .45s ease-in both}
@keyframes dawn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sunrise{from{transform:translateY(74px)}to{transform:translateY(0)}}
@keyframes halo{0%{opacity:0;transform:scale(1)}12%{opacity:.9}100%{opacity:0;transform:scale(2.1)}}
@keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rayin{from{opacity:0}to{opacity:.3}}
@keyframes chase{0%,100%{opacity:.3}35%{opacity:1}}
@keyframes exit{to{opacity:0;transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){.play *{animation:none !important}}

:root{--btn-bg:#0B1F3A;--btn-fg:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--btn-bg:#FFFFFF;--btn-fg:#0B1F3A}}
:root[data-theme="dark"]{--btn-bg:#FFFFFF;--btn-fg:#0B1F3A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);font-family:Poppins,'Segoe UI','Helvetica Neue',Arial,sans-serif}
.stage{height:100%;display:grid;place-items:center}
#logo{width:min(88vw,560px);height:auto;display:block;overflow:visible}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:20px 0 calc(20px + env(safe-area-inset-bottom,0px))}
button{font:600 15px/1 inherit;font-family:inherit;color:var(--btn-fg);background:var(--btn-bg);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;opacity:.9}


.app{display:none;min-height:100%;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.app.show{display:block}
.app header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.app header svg{width:40px;height:40px;flex:0 0 auto}
.app h1{font-size:20px;margin:0;color:var(--w1)}
.card{background:color-mix(in srgb, var(--w1) 6%, transparent);border-radius:16px;padding:18px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 6px;color:var(--w1)}
.card p{font-size:14px;margin:0;color:color-mix(in srgb, var(--w1) 65%, transparent);line-height:1.5}

:root{--btn-bg:#0B1F3A;--btn-fg:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--btn-bg:#FFFFFF;--btn-fg:#0B1F3A}}
:root[data-theme="dark"]{--btn-bg:#FFFFFF;--btn-fg:#0B1F3A}
.stage{position:fixed;inset:0;transition:opacity .4s ease}
</style>
</head>

<div class="app" id="app">
  <header>
    <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <circle cx="150" cy="150" r="105" fill="var(--badge)"/>
      <circle cx="150" cy="112" r="34" fill="var(--gold)"/>
      <polygon points="98,105 132,105 150,140 168,105 202,105 150,205" fill="var(--v)"/>
    </svg>
    <h1>VentraSA</h1>
  </header>
  <div class="card">
    <h2>Welcome</h2>
    <p>This is the app shell. Replace this with your real screens — the splash above has already played and faded out.</p>
  </div>
  <div class="card">
    <h2>Installed as a PWA</h2>
    <p>Add VentraSA to your home screen from the browser menu to launch it full-screen, offline-ready, with this splash on open.</p>
  </div>
</div>

<script>
(function () {
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (err) {
        console.warn("Service worker registration failed:", err);
      });
    });
  }

  var stage = document.getElementById("stage");
  var app = document.getElementById("app");

  // Swap this timeout for your real "app is ready" signal.
  var MIN_SPLASH_MS = 2600;
  var start = Date.now();

  function showApp() {
    var elapsed = Date.now() - start;
    var wait = Math.max(0, MIN_SPLASH_MS - elapsed);
    setTimeout(function () {
      stage.style.opacity = "0";
      app.classList.add("show");
      setTimeout(function () { stage.remove(); }, 450);
    }, wait);
  }

  if (document.readyState === "complete") showApp();
  else window.addEventListener("load", showApp);
})();
</script>
